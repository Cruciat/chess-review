[project]
name = "chessreview"
version = "0.1.0"
description = "Analisi locale delle partite di scacchi"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "chess>=1.10",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chessreview"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "tests"
